; Claude Phone dialplan
;
;   2525  talk to Claude (record a prompt; hang up or pause 3s to send)
;   *26   mute / unmute callbacks from Claude
;   600   echo test (hear yourself; checks audio both ways)

[general]
static = yes
writeprotect = yes

[from-phone]
exten => 2525,1,Goto(claude-prompt,s,1)

exten => *26,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf(${STAT(e,/spool/state/muted)}?unmute)
 same => n,System(touch /spool/state/muted)
 same => n,Playback(/spool/tts/muted)
 same => n,Hangup()
 same => n(unmute),System(rm -f /spool/state/muted)
 same => n,Playback(/spool/tts/unmuted)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ---- You -> Claude --------------------------------------------------------
; Records to /spool/tmp, then moves the finished file to /spool/in on hangup
; so the watcher never sees a half-written recording.
[claude-prompt]
exten => s,1,Answer()
 same => n,Wait(0.4)
 same => n,Playback(/spool/tts/beep)
 same => n,Record(/spool/tmp/prompt-${UNIQUEID}.wav16,3,120,qk)
 same => n,Hangup()

exten => h,1,System(test -f /spool/tmp/prompt-${UNIQUEID}.wav16 && mv /spool/tmp/prompt-${UNIQUEID}.wav16 /spool/in/prompt-${UNIQUEID}.wav16)

; ---- Claude -> you --------------------------------------------------------
; Dialed by call files the watcher drops in /spool/outgoing.
; CALLID and CALLKIND are set by the call file.
[claude-callback]
exten => s,1,Answer()
 same => n,Wait(0.6)
 same => n,Playback(/spool/tts/${CALLID})
 same => n,GotoIf($["${CALLKIND}" = "permission"]?perm,1)
 same => n,GotoIf($["${CALLKIND}" = "done"]?bye)
 same => n,Playback(/spool/tts/beep)
 same => n,Record(/spool/tmp/reply-${CALLID}.wav16,3,120,qk)
 same => n(bye),Hangup()

; Permission prompts: 1 = allow, 2 = deny (anything else = do nothing)
exten => perm,1,Read(CHOICE,,1,,1,10)
 same => n,GotoIf($["${CHOICE}" = "1" | "${CHOICE}" = "2"]?ok)
 same => n,Playback(/spool/tts/nochoice)
 same => n,Hangup()
 same => n(ok),System(echo ${CHOICE} > /spool/tmp/perm-${CALLID}.txt && mv /spool/tmp/perm-${CALLID}.txt /spool/in/perm-${CALLID}.txt)
 same => n,Playback(/spool/tts/${IF($["${CHOICE}" = "1"]?approved:denied)})
 same => n,Hangup()

exten => h,1,System(test -f /spool/tmp/reply-${CALLID}.wav16 && mv /spool/tmp/reply-${CALLID}.wav16 /spool/in/reply-${CALLID}.wav16)

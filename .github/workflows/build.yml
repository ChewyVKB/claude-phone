name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claude-phone-asterisk
            context: asterisk
          - name: claude-phone-box
            context: claude-box
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Start the new Asterisk image with a fake trunk and check the config loads
  test-asterisk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        run: |
          IMG=ghcr.io/${OWNER}/claude-phone-asterisk:${GITHUB_SHA}
          docker run -d --name ast --network host \
            -e PHONE_PASSWORD=testpass -e TRUNK_USER=100000_test -e TRUNK_PASSWORD=x \
            -e TRUNK_SERVER=chicago.voip.ms -e TRUNK_NUMBER=5551234567 "$IMG"
          for i in $(seq 1 30); do docker exec ast asterisk -rx "core show uptime" >/dev/null 2>&1 && break; sleep 2; done
          sleep 3
          fail=0
          check() {  # check "<asterisk command>" "<text that must appear>"
            out=$(docker exec ast asterisk -rx "$1" 2>&1)
            if printf '%s' "$out" | grep -qF -- "$2"; then echo "OK: $1"; else
              fail=1
              msg=$(printf '%s' "$out" | head -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=missing '$2' in: $1::$msg"
            fi
          }
          check "pjsip show endpoint voipms" "from-voipms"
          check "pjsip show registrations" "voipms-reg"
          check "dialplan show 5551234567@from-phone" 'PJSIP/1${EXTEN}@voipms'
          check "dialplan show 911@from-phone" "PJSIP/911@voipms"
          check "dialplan show 2525@from-phone" "claude-prompt"
          check "dialplan show s@ring-phone" "PJSIP/100"
          if [ "$fail" = 1 ]; then
            echo "::error title=asterisk log::$(docker logs ast 2>&1 | grep -iE 'error|warn' | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "Asterisk config OK"

name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claude-phone-asterisk
            context: asterisk
          - name: claude-phone-box
            context: claude-box
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (registry names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Start the new Asterisk image with a fake trunk and check the config loads
  test-asterisk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        run: |
          IMG=ghcr.io/${OWNER}/claude-phone-asterisk:${GITHUB_SHA}
          docker run -d --name ast --network host \
            -e PHONE_PASSWORD=testpass -e TRUNK_USER=100000_test -e TRUNK_PASSWORD=x \
            -e TRUNK_SERVER=chicago.voip.ms -e TRUNK_NUMBER=5551234567 "$IMG"
          sleep 15
          docker logs ast 2>&1 | tail -20
          ast() { docker exec ast asterisk -rx "$1"; }
          ast "pjsip show endpoint voipms" | grep -q "from-voipms"
          ast "pjsip show registrations" | grep -q "voipms-reg"
          ast "dialplan show 5551234567@from-phone" | grep -qF 'PJSIP/1${EXTEN}@voipms'
          ast "dialplan show 911@from-phone" | grep -q "PJSIP/911@voipms"
          ast "dialplan show 2525@from-phone" | grep -q "claude-prompt"
          ast "dialplan show s@ring-phone" | grep -q "PJSIP/100"
          echo "Asterisk config OK"
